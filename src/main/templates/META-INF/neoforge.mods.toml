modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
credits = "Icon by xninjaxpancake"
logoFile = "dicelib_logo.png"
logoBlur = false
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# GeckoLib draws the animated props and the body parts.
[[dependencies."${mod_id}"]]
modId = "geckolib"
type = "required"
versionRange = "[4.9,)"
ordering = "AFTER"
side = "BOTH"

# PlayerAnimationLib plays PlayerAnims on players.
[[dependencies."${mod_id}"]]
modId = "player_animation_library"
type = "required"
versionRange = "[1.1.6,)"
ordering = "AFTER"
side = "BOTH"
