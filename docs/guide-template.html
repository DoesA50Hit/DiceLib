<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DiceLib Guide</title><style>
:root{color-scheme:light;--bg:#ffffff;--panel:#f6f8fa;--text:#1f2328;--muted:#59636e;--line:#d0d7de;--accent:#0969da;--accent-emph:#0969da;--accent2:#8250df;
--code-bg:#f6f8fa;--code-inline:rgba(129,139,152,.15);--kw:#cf222e;--str:#0a3069;--com:#59636e;--num:#0550ae;--ann:#953800;--typ:#6639ba;--key:#0550ae;
--note:#0969da;--tip:#1a7f37;--warning:#9a6700;--danger:#d1242f;--bug:#d1242f;--important:#8250df;--mark:#fff8c5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d1117;--panel:#161b22;--text:#e6edf3;--muted:#9198a1;--line:#30363d;--accent:#4493f8;--accent-emph:#1f6feb;--accent2:#ab7df8;
--code-bg:#161b22;--code-inline:rgba(101,108,118,.3);--kw:#ff7b72;--str:#a5d6ff;--com:#9198a1;--num:#79c0ff;--ann:#ffa657;--typ:#d2a8ff;--key:#79c0ff;
--note:#4493f8;--tip:#3fb950;--warning:#d29922;--danger:#f85149;--bug:#f85149;--important:#ab7df8;--mark:#9e6a03}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--text:#e6edf3;--muted:#9198a1;--line:#30363d;--accent:#4493f8;--accent-emph:#1f6feb;--accent2:#ab7df8;
--code-bg:#161b22;--code-inline:rgba(101,108,118,.3);--kw:#ff7b72;--str:#a5d6ff;--com:#9198a1;--num:#79c0ff;--ann:#ffa657;--typ:#d2a8ff;--key:#79c0ff;
--note:#4493f8;--tip:#3fb950;--warning:#d29922;--danger:#f85149;--bug:#f85149;--important:#ab7df8;--mark:#9e6a03}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;display:flex;min-height:100vh}
aside{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--line);height:100vh;position:sticky;top:0;
display:flex;flex-direction:column}
.brand{padding:16px 16px 8px;font-weight:700;font-size:17px}.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.searchbox{padding:0 16px 10px;display:flex;gap:6px}
.searchbox input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit;font-size:14px}
#theme{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:6px;cursor:pointer;padding:0 9px}
nav.side{overflow-y:auto;padding:0 8px 24px;flex:1}
.ghead{display:flex;align-items:center;gap:6px;width:100%;background:none;border:0;cursor:pointer;font:inherit;
font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 4px;padding:2px 8px;text-align:left}
.ghead:hover{color:var(--text)}
.caret{display:inline-block;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;
border-top:5px solid currentColor;transition:transform .15s;flex:none}
[aria-expanded="false"]>.caret{transform:rotate(-90deg)}
.ngroup.closed>.gbody{display:none}
.nrow{display:flex;align-items:center}.nrow .nlink{flex:1;min-width:0}
.twist{background:none;border:0;cursor:pointer;color:var(--muted);width:18px;height:24px;padding:0;flex:none;display:flex;
align-items:center;justify-content:center}.twist:hover{color:var(--text)}.twist-pad{width:18px;flex:none}
.sidetools{display:flex;gap:12px;padding:0 16px 6px;font-size:12px}
.sidetools button{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:inherit}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
#collapse{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:6px;cursor:pointer;
padding:2px 8px;font-size:14px;line-height:1.4}
body.side-collapsed aside{display:none}
body.side-collapsed #menu{display:block;position:fixed;top:10px;left:10px;z-index:11;padding:6px 12px;border:1px solid var(--line);
border-radius:6px;background:var(--panel);color:var(--text);cursor:pointer}
body.side-collapsed main{padding-top:56px}
body.side-collapsed article,body.side-collapsed #results{max-width:1890px}
.nlink{display:block;padding:4px 8px;border-radius:5px;color:var(--text);text-decoration:none;font-size:14px}
.nlink:hover{background:var(--line)}.nlink.active{background:var(--accent-emph);color:#ffffff}
.nsubs{display:none;margin:2px 0 6px 26px;border-left:2px solid var(--line)}.nsubs.open{display:block}
.nsub{display:block;padding:2px 8px;font-size:13px;color:var(--muted);text-decoration:none}.nsub:hover{color:var(--accent)}
.nsub code{font-size:12px}
main{flex:1;min-width:0;padding:32px 40px 80px}
article{max-width:1400px;margin:0 auto}
h1{font-size:30px;line-height:1.25;margin:0 0 16px}h2{font-size:22px;margin:36px 0 10px;padding-bottom:4px;border-bottom:1px solid var(--line)}
h3{font-size:18px;margin:26px 0 8px}h4{font-size:16px}
h1,h2,h3,h4{position:relative}.anchor{opacity:0;margin-left:8px;color:var(--muted);text-decoration:none;font-weight:400}
h2:hover .anchor,h3:hover .anchor,h4:hover .anchor{opacity:1}
a{color:var(--accent)}a.wl{text-decoration:none;border-bottom:1px dotted var(--accent)}
code{font:13.5px/1.5 ui-monospace,"Cascadia Code",Consolas,monospace;background:var(--code-inline);padding:1px 5px;border-radius:4px}
.code{position:relative;margin:14px 0}.code pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;
padding:14px 16px;overflow-x:auto}.code pre code{background:none;padding:0;font-size:13px;white-space:pre}
.copy{position:absolute;top:6px;right:6px;font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:5px;
background:var(--bg);color:var(--muted);cursor:pointer;opacity:0;transition:opacity .15s}.code:hover .copy{opacity:1}
.t-kw{color:var(--kw)}.t-str{color:var(--str)}.t-com{color:var(--com);font-style:italic}.t-num{color:var(--num)}
.t-ann{color:var(--ann)}.t-typ{color:var(--typ)}.t-key{color:var(--key)}
.table{overflow-x:auto;margin:14px 0}table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}th{background:var(--panel)}
td code,th code{font-size:12.5px;overflow-wrap:break-word}
.callout{border:1px solid var(--line);border-left:4px solid var(--c,var(--note));border-radius:6px;padding:10px 14px;margin:16px 0;
background:color-mix(in srgb,var(--c,var(--note)) 7%,transparent)}
.ctitle{font-weight:600;color:var(--c,var(--note));display:flex;gap:8px;align-items:center}.cbody>*:last-child{margin-bottom:0}
.cbody>*:first-child{margin-top:6px}
.c-tip{--c:var(--tip)}.c-warning{--c:var(--warning)}.c-danger{--c:var(--danger)}.c-bug{--c:var(--bug)}.c-important{--c:var(--important)}
.c-info,.c-note{--c:var(--note)}
blockquote{margin:14px 0;padding:4px 14px;border-left:3px solid var(--line);color:var(--muted)}
li.task{list-style:none;margin-left:-22px}li.task input{margin-right:6px}
.pager{display:flex;justify-content:space-between;gap:16px;margin-top:48px;padding-top:16px;border-top:1px solid var(--line)}
.pager a{text-decoration:none}
#results{max-width:1400px;margin:0 auto}#results h1{font-size:24px}.hit{display:block;padding:10px 12px;border:1px solid var(--line);
border-radius:8px;margin:8px 0;text-decoration:none;color:var(--text)}.hit:hover{border-color:var(--accent)}
.hit b{color:var(--accent)}.hit .where{font-size:12px;color:var(--muted)}.hit .snip{font-size:14px;margin-top:4px}
mark{background:var(--mark);color:inherit;border-radius:2px}
#menu{display:none}
@media (max-width:860px){body.side-collapsed aside{display:flex}#collapse{display:none}body{display:block}aside{position:fixed;inset:0 auto 0 0;width:85vw;max-width:320px;transform:translateX(-100%);
transition:transform .2s;z-index:10}aside.open{transform:none}main{padding:56px 16px 60px}
#menu{display:block;position:fixed;top:10px;left:10px;z-index:11;padding:6px 12px;border:1px solid var(--line);border-radius:6px;
background:var(--panel);color:var(--text)}}
</style></head>
<body>
<button id="menu">☰ Menu</button>
<aside>
  <div class="brand"><div>DiceLib Guide<small>NeoForge 1.21.1</small></div>
  <button id="collapse" title="Hide the sidebar (\ key)">«</button></div>
  <div class="searchbox"><input id="q" type="search" placeholder="Search (press /)" autocomplete="off">
  <button id="theme" title="Toggle dark mode">◐</button></div>
  <div class="sidetools"><button id="expand-all">Expand all</button><button id="collapse-all">Collapse all</button></div>
  <nav class="side">{{NAV}}</nav>
</aside>
<main>
<div id="results" hidden></div>
{{ARTICLES}}
</main>
<script>
const SEARCH = {{SEARCH}};
const arts = [...document.querySelectorAll('article')];
const links = [...document.querySelectorAll('.nlink')];
const results = document.getElementById('results');
const input = document.getElementById('q');
function show(hash){
  hash = decodeURIComponent((hash||'').replace(/^#/,''));
  if(hash.startsWith('search=')){ input.value = hash.slice(7); runSearch(input.value, false); return; }
  const note = (hash.split('--')[0]) || 'home';
  let target = document.getElementById(note) ? note : 'home';
  results.hidden = true;
  arts.forEach(a => a.hidden = a.id !== target);
  links.forEach(l => l.classList.toggle('active', l.dataset.note === target));
  setSubs(target, true, true);
  openGroupOf(target);
  document.title = document.getElementById(target).dataset.title + ' · DiceLib Guide';
  const el = hash.includes('--') ? document.getElementById(hash) : null;
  if(el){ el.scrollIntoView(); } else { window.scrollTo(0,0); }
  document.querySelector('aside').classList.remove('open');
}
window.addEventListener('hashchange', () => show(location.hash));
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function runSearch(q, push){
  q = q.trim();
  if(!q){ show(location.hash.startsWith('#search=') ? '#home' : location.hash); return; }
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = [];
  for(const e of SEARCH){
    const hay = (e.n+' '+e.s+' '+e.t).toLowerCase();
    if(!terms.every(t => hay.includes(t))) continue;
    let score = 0;
    for(const t of terms){
      if(e.s.toLowerCase().includes(t)) score += 10;
      if(e.n.toLowerCase().includes(t)) score += 4;
      score += Math.min(hay.split(t).length - 1, 10);
    }
    hits.push([score, e]);
  }
  hits.sort((a,b) => b[0]-a[0]);
  const re = new RegExp('(' + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')', 'gi');
  let html = '<h1>Search: ' + esc(q) + '</h1><p>' + hits.length + ' section' + (hits.length===1?'':'s') + ' found.</p>';
  for(const [, e] of hits.slice(0, 80)){
    const low = e.t.toLowerCase(); let p = low.indexOf(terms[0]); if(p < 0) p = 0;
    const start = Math.max(0, p - 80); let snip = e.t.slice(start, start + 240);
    snip = (start ? '…' : '') + esc(snip) + (start + 240 < e.t.length ? '…' : '');
    html += '<a class="hit" href="#' + e.a + '"><div class="where">' + esc(e.n) + '</div><b>' +
      esc(e.s).replace(re,'<mark>$1</mark>') + '</b><div class="snip">' + snip.replace(re,'<mark>$1</mark>') + '</div></a>';
  }
  arts.forEach(a => a.hidden = true);
  links.forEach(l => l.classList.remove('active'));
  results.innerHTML = html; results.hidden = false; window.scrollTo(0,0);
  if(push) history.replaceState(null, '', '#search=' + encodeURIComponent(q));
}
let timer; input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => runSearch(input.value, true), 180); });
input.addEventListener('keydown', e => { if(e.key === 'Escape'){ input.value=''; show('#home'); } });
document.addEventListener('keydown', e => { if(e.key === '/' && document.activeElement !== input){ e.preventDefault(); input.focus(); } });
document.querySelectorAll('.copy').forEach(b => b.addEventListener('click', () => {
  const code = b.nextElementSibling.innerText;
  const done = () => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1200); };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(code).then(done, () => fallback(code, done)); }
  else fallback(code, done);
}));
function fallback(text, done){ const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t);
  t.select(); try{ document.execCommand('copy'); done(); }catch(e){} t.remove(); }
const root = document.documentElement;
try{ const saved = localStorage.getItem('mc-guide-theme'); if(saved) root.dataset.theme = saved; }catch(e){}
document.getElementById('theme').addEventListener('click', () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try{ localStorage.setItem('mc-guide-theme', root.dataset.theme); }catch(e){}
});
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const mobile = () => matchMedia('(max-width: 860px)').matches;
function setSidebar(collapsed){
  document.body.classList.toggle('side-collapsed', collapsed);
  document.getElementById('menu').title = collapsed ? 'Show the sidebar' : '';
  store.set('mc-guide-sidebar-collapsed', collapsed);
}
document.getElementById('collapse').addEventListener('click', () => setSidebar(true));
document.getElementById('menu').addEventListener('click', () => {
  if (mobile()) document.querySelector('aside').classList.toggle('open');
  else setSidebar(false);
});
document.addEventListener('keydown', e => {
  if (e.key === '\\' && document.activeElement !== input && !mobile()){
    setSidebar(!document.body.classList.contains('side-collapsed'));
  }
});
if (store.get('mc-guide-sidebar-collapsed')) setSidebar(true);
const groups = [...document.querySelectorAll('.ngroup')];
const closedGroups = new Set(store.get('mc-guide-closed-groups') || []);
function setGroup(g, open){
  g.classList.toggle('closed', !open);
  g.querySelector('.ghead').setAttribute('aria-expanded', String(open));
  if (open) closedGroups.delete(g.dataset.group); else closedGroups.add(g.dataset.group);
  store.set('mc-guide-closed-groups', [...closedGroups]);
}
groups.forEach(g => {
  if (closedGroups.has(g.dataset.group)) setGroup(g, false);
  g.querySelector('.ghead').addEventListener('click', () => setGroup(g, g.classList.contains('closed')));
});
function openGroupOf(note){
  const link = document.querySelector('.nlink[data-note="' + note + '"]');
  const g = link && link.closest('.ngroup');
  if (g && g.classList.contains('closed')) setGroup(g, true);
}
function setSubs(note, open, exclusive){
  document.querySelectorAll('.nsubs').forEach(s => {
    const mine = s.dataset.for === note;
    if (mine || exclusive){
      const want = mine ? open : false;
      s.classList.toggle('open', want);
      const t = document.querySelector('.twist[data-for="' + s.dataset.for + '"]');
      if (t) t.setAttribute('aria-expanded', String(want));
    }
  });
}
document.querySelectorAll('.twist').forEach(t => t.addEventListener('click', () => {
  setSubs(t.dataset.for, t.getAttribute('aria-expanded') !== 'true', false);
}));
document.getElementById('expand-all').addEventListener('click', () => {
  groups.forEach(g => setGroup(g, true));
  document.querySelectorAll('.nsubs').forEach(s => setSubs(s.dataset.for, true, false));
});
document.getElementById('collapse-all').addEventListener('click', () => {
  document.querySelectorAll('.nsubs').forEach(s => setSubs(s.dataset.for, false, false));
  groups.forEach(g => setGroup(g, false));
});
show(location.hash || '#home');
</script>
</body></html>
